services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    networks:
      - homelab_net
    ports:
      - "${BIND_IP:-0.0.0.0}:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

networks:
  homelab_net:
    external: true

volumes:
  portainer_data: