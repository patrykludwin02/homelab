groups:
  - name: docker_alerts
    rules:
      - alert: ContainerDown
        expr: time() - container_last_seen{name!=""} > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Kontener {{ $labels.name }} nie odpowiada"

      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Zadanie {{ $labels.job }} ({{ $labels.instance }}) nie odpowiada"

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Wysokie zużycie CPU na serwerze (>90% przez 5 min)"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Wysokie zużycie RAM (>90% przez 5 min)"

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint=~"/|/mnt/dane_120|/mnt/karta_sd"} / node_filesystem_size_bytes{mountpoint=~"/|/mnt/dane_120|/mnt/karta_sd"}) * 100 < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Mało miejsca na {{ $labels.mountpoint }} (poniżej 10%)"

      - alert: FilesystemReadOnly
        expr: node_filesystem_readonly{mountpoint=~"/|/mnt/dane_120|/mnt/karta_sd"} == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "System plików {{ $labels.mountpoint }} przeszedł w tryb tylko do odczytu (błąd dysku lub karty SD?)"

      - alert: DiskMountMissing
        expr: absent(node_filesystem_size_bytes{mountpoint="/mnt/dane_120"}) or absent(node_filesystem_size_bytes{mountpoint="/mnt/karta_sd"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Dysk /mnt/dane_120 lub /mnt/karta_sd nie jest zamontowany"
