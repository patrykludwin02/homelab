services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    volumes:
      - ./files:/srv
      - ${HOST_HOME:-/home/homelab}:/srv/home
      - ./config:/config
    ports:
      - "${BIND_IP:-0.0.0.0}:8083:80"
    networks:
      - homelab_net

networks:
  homelab_net:
    external: true